<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>智游向导 · 旅游知识库</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');

    :root {
      --bg-color: #f4f7f6;
      --panel-bg: rgba(255, 255, 255, 0.85);
      --text-main: #334155;
      --text-muted: #64748b;
      --brand-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --brand-hover: linear-gradient(135deg, #3aa3f7 0%, #00e0fd 100%);
      --bubble-user: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --bubble-bot: #ffffff;
      --border-color: rgba(0, 0, 0, 0.06);
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 20px 40px -10px rgba(0, 100, 200, 0.08);
      --shadow-focus: 0 0 0 3px rgba(79, 172, 254, 0.2);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      /* 明亮活泼的度假风网格渐变背景 */
      background-image:
        radial-gradient(at 80% 0%, hsla(189, 100%, 86%, 0.6) 0px, transparent 50%),
        radial-gradient(at 0% 50%, hsla(200, 100%, 93%, 0.6) 0px, transparent 50%),
        radial-gradient(at 80% 100%, hsla(240, 100%, 93%, 0.4) 0px, transparent 50%),
        radial-gradient(at 0% 0%, hsla(190, 100%, 88%, 0.5) 0px, transparent 50%);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 1000px;
      height: min(860px, 94vh);
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 24px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.5);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 42px; height: 42px;
      border-radius: 12px;
      background: var(--brand-gradient);
      box-shadow: 0 8px 16px rgba(79, 172, 254, 0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: white;
    }

    .title { display: flex; flex-direction: column; line-height: 1.2; }
    .title strong { font-size: 16px; font-weight: 700; color: #1e293b; }
    .title span { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    .top-actions {
      margin-left: auto;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .stream-toggle {
      font-size: 13px;
      display: flex; align-items: center; gap: 6px;
      cursor: pointer; user-select: none; color: var(--text-muted);
      margin-right: 12px;
      transition: color 0.3s;
    }
    .stream-toggle:hover { color: #4facfe; }

    .btn {
      border: none;
      background: white;
      color: #334155;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }
    .btn:hover { background: #f8fafc; transform: translateY(-1px); box-shadow: 0 6px 12px rgba(0,0,0,0.05); }
    .btn:active { transform: translateY(0); }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      background: transparent;
      scroll-behavior: smooth;
    }
    .chat::-webkit-scrollbar { width: 6px; }
    .chat::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }

    .dayline {
      text-align: center; color: var(--text-muted); font-size: 12px; margin: 10px 0 24px;
      font-weight: 500;
    }

    .msg { display: flex; gap: 12px; margin: 16px 0; align-items: flex-end; animation: fadeIn 0.4s ease forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .msg.user { justify-content: flex-end; }
    .msg > div:not(.avatar) { flex: 1; min-width: 0; }
    .msg.user > div:not(.avatar) { display: flex; flex-direction: column; align-items: flex-end; }

    .avatar {
      width: 38px; height: 38px; border-radius: 12px;
      background: white;
      box-shadow: var(--shadow-sm);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex: 0 0 auto; border: 1px solid var(--border-color);
    }
    .avatar.bot { background: var(--brand-gradient); color: white; border: none; box-shadow: 0 4px 10px rgba(79, 172, 254, 0.2); }

    .bubble {
      max-width: min(760px, 80%);
      display: inline-block;
      border-radius: 18px;
      padding: 14px 18px;
      background: var(--bubble-bot);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      position: relative;
      line-height: 1.6;
      font-size: 15px;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .msg.bot .bubble { border-bottom-left-radius: 4px; }
    .msg.user .bubble {
      background: var(--bubble-user);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 6px 16px rgba(79, 172, 254, 0.25);
      border-bottom-right-radius: 4px;
    }

    .meta { font-size: 12px; color: #cbd5e1; margin-top: 6px; padding: 0 4px; }
    .msg.bot .meta { color: var(--text-muted); }

    details.progress {
      margin-top: 12px;
      border: 1px dashed rgba(79, 172, 254, 0.4);
      border-radius: 14px;
      padding: 10px 14px;
      background: rgba(79, 172, 254, 0.03);
    }
    details.progress summary { cursor: pointer; user-select: none; color: #3b82f6; font-size: 13px; font-weight: 500; }
    .progress ul { margin: 10px 0 0 18px; padding: 0; }
    .progress li { margin: 6px 0; font-size: 13px; color: var(--text-muted); }

    .answer-images { margin-top: 14px; display: flex; flex-direction: column; gap: 12px; }
    .answer-images img {
      display: block; max-width: min(100%, 600px); border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      background: #fff; transition: transform 0.3s;
    }
    .answer-images img:hover { transform: scale(1.02); }
    .answer-images a { font-size: 12px; color: #3b82f6; text-decoration: none; word-break: break-all; }

    .typing { display: inline-flex; gap: 6px; align-items: center; padding: 4px 0; }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--brand-gradient);
      animation: bounce 1.2s infinite ease-in-out;
    }
    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%,80%,100% { transform: translateY(0); opacity: 0.4; } 40% { transform: translateY(-6px); opacity: 1; } }

    .composer {
      padding: 16px 24px;
      background: rgba(255, 255, 255, 0.6);
      border-top: 1px solid rgba(0,0,0,0.03);
    }
    .input-box {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      background: white;
      padding: 8px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
      transition: box-shadow 0.3s, border-color 0.3s;
    }
    .input-box:focus-within {
      border-color: #4facfe; box-shadow: var(--shadow-focus), 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    textarea {
      flex: 1; resize: none; min-height: 44px; max-height: 150px;
      padding: 10px 8px; border: none; outline: none;
      font-size: 15px; line-height: 1.5; color: var(--text-main);
      background: transparent; font-family: inherit;
    }
    textarea::placeholder { color: #94a3b8; }

    .send {
      width: 44px; height: 44px; border: none; border-radius: 14px;
      cursor: pointer; color: #fff;
      background: var(--brand-gradient);
      box-shadow: 0 4px 12px rgba(79, 172, 254, 0.3);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; flex-shrink: 0;
    }
    .send svg { width: 20px; height: 20px; fill: currentColor; margin-left: 2px; }
    .send:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(79, 172, 254, 0.4); }
    .send:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .hint { text-align: center; padding-top: 12px; color: #94a3b8; font-size: 12px; }
    .kbd {
      font-family: ui-monospace, SFMono-Regular, monospace;
      border: 1px solid #e2e8f0; padding: 2px 6px; border-radius: 6px;
      background: #f8fafc; color: #64748b; font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo">✈️</div>
        <div class="title">
          <strong>智游向导知识库</strong>
          <span id="subTitle">全球旅行攻略 · 在线规划与查询</span>
        </div>
      </div>
      <div class="top-actions">
        <label class="stream-toggle">
          <input type="checkbox" id="streamToggle" checked> 流式输出
        </label>
        <button class="btn" id="btnClear">清空旅程</button>
      </div>
    </div>

    <div class="chat" id="chat">
      <div class="dayline">全新的旅程，从今天开始</div>
      <div class="msg bot">
        <div class="avatar bot">导</div>
        <div>
          <div class="bubble">你好！我是你的专属旅游向导 🏝️。你可以直接告诉我你想去哪里，或者询问具体的景点路线、特色美食和交通指南。</div>
          <div class="meta">💡 提示：试着问我 “去三亚该怎么规划路线？” 或 “成都春熙路附近有什么好吃的？”</div>
        </div>
      </div>
    </div>

    <div class="composer">
      <div class="input-box">
        <textarea id="input" placeholder="输入你想去的地方或旅游问题..."></textarea>
        <button class="send" id="send" aria-label="发送">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
        </button>
      </div>
      <div class="hint">快捷键：<span class="kbd">Enter</span> 发送，<span class="kbd">Shift</span>+<span class="kbd">Enter</span> 换行</div>
    </div>
  </div>

  <script>
    const API_BASE = `${location.protocol}//${location.host}`.includes('http') ? `${location.protocol}//${location.host}` : 'http://127.0.0.1:8001';
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const btnClear = document.getElementById('btnClear');
    const streamToggle = document.getElementById('streamToggle');

    let sessionId = localStorage.getItem('kb_session_id');
    if (!sessionId) {
      sessionId = 'sess-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('kb_session_id', sessionId);
    }

    function scrollToBottom(){ chatEl.scrollTop = chatEl.scrollHeight; }
    function nowTime(){ return new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'}); }
    function formatTime(ts){
      if(!ts) return nowTime();
      const d = new Date(Number(ts) * 1000);
      if(Number.isNaN(d.getTime())) return nowTime();
      return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    function escapeHtml(str){
      return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;");
    }

    function isImageUrl(url){
      try { return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(new URL(url).pathname); }
      catch (e) { return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(url || ''); }
    }
    function normalizeUrl(rawUrl){ return String(rawUrl || '').trim().replace(/\s/g, '%20'); }
    function dedupeKeepOrder(arr){ return [...new Set((arr || []).filter(Boolean))]; }

    function extractUrlsLoose(text){
      const regex = /(https?:\/\/[^\s]+)/g;
      const matches = String(text || '').match(regex) || [];
      return dedupeKeepOrder(matches.map(u => u.replace(/[)\]}'">，。,;；\]】）＞]+$/g, '').replace(/^[<([{'"]+|^[＜（【\[]+/g, '')));
    }

    function findLastImageMarkerIndex(raw){
      const re = /【\s*图片\s*】|\[\s*图片\s*\]/g;
      let m, lastIdx = -1, lastLen = 0;
      while((m = re.exec(raw)) !== null){ lastIdx = m.index; lastLen = m[0].length; }
      return { idx: lastIdx, len: lastLen };
    }

    function parseAnswerAndImages(text){
      const raw = String(text || '');
      const { idx, len } = findLastImageMarkerIndex(raw);
      if(idx === -1) return { text: raw, images: [] };

      const before = raw.slice(0, idx).trimEnd();
      const after = raw.slice(idx + len).trim();
      const urls = [];

      after.split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach(line => {
        if(line.startsWith('http://') || line.startsWith('https://')) urls.push(line);
        else urls.push(...extractUrlsLoose(line));
      });
      return { text: before, images: dedupeKeepOrder(urls.map(normalizeUrl).filter(isImageUrl)) };
    }

    function renderAnswerWithImages(containerEl, answerText, candidateImageUrls){
      const { text, images: imagesFromBlock } = parseAnswerAndImages(answerText);
      const candidates = (candidateImageUrls || []).map(normalizeUrl).filter(isImageUrl);
      const looseImages = extractUrlsLoose(answerText).map(normalizeUrl).filter(isImageUrl);

      const allImages = [...new Set([...(imagesFromBlock || []), ...candidates, ...looseImages])];

      containerEl.textContent = '';
      const textEl = document.createElement('div');
      textEl.className = 'answer-text';
      textEl.textContent = (text || '').trim().length > 0 ? text : '（已完成，但未返回答案）';
      containerEl.appendChild(textEl);

      if(allImages.length > 0){
        const imgWrap = document.createElement('div');
        imgWrap.className = 'answer-images';
        allImages.forEach(url => {
          const safeUrl = normalizeUrl(url);
          const img = document.createElement('img');
          img.loading = 'lazy'; img.src = safeUrl; img.alt = '参考风景照';
          img.onerror = () => img.style.display = 'none';
          imgWrap.appendChild(img);
        });
        containerEl.appendChild(imgWrap);
      }
    }

    function addUserMsg(text, ts){
      const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
          <div class="avatar">我</div>
        </div>`;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
    }

    function addBotMsgWithTime(text, ts, imageUrls){
      const id = 'bot-his-' + Math.random().toString(36).slice(2);
      const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">导</div>
          <div>
            <div class="bubble"><div class="answer"></div></div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
        </div>`;
      chatEl.insertAdjacentHTML('beforeend', html);
      renderAnswerWithImages(document.getElementById(id).querySelector('.answer'), text || '', imageUrls || []);
      scrollToBottom();
    }

    function addBotMsgSkeleton(){
      const id = 'bot-' + Math.random().toString(36).slice(2);
      const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">导</div>
          <div style="min-width: 220px;">
            <div class="bubble">
              <span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
              <details class="progress" open>
                <summary>正在规划路线...</summary>
                <ul></ul>
              </details>
            </div>
            <div class="meta">${nowTime()}</div>
          </div>
        </div>`;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
      return document.getElementById(id);
    }

    function renderProgress(botMsgEl, doneList, runningList, status){
      const details = botMsgEl.querySelector('details.progress');
      if(!details) return;
      const summary = details.querySelector('summary');
      const ul = details.querySelector('ul');
      const done = doneList || [], running = runningList || [];

      const statusMap = { 'processing': '搜索攻略中', 'completed': '规划完成', 'failed': '获取失败', 'pending': '准备出发' };
      summary.textContent = `路线探寻中（已完成${done.length}项，状态：${statusMap[status] || status || '未知'}）`;

      ul.innerHTML = '';
      const lines = [...done.map(x => `✅ ${x}`), ...running.map(x => `✈️ ${x}`)];
      if(lines.length === 0) ul.insertAdjacentHTML('beforeend', '<li>正在整理行囊...</li>');
      else lines.forEach(line => ul.insertAdjacentHTML('beforeend', `<li>${escapeHtml(line)}</li>`));
    }

    function finalizeBotAnswer(botMsgEl, answer, error, imageUrls){
      const bubble = botMsgEl.querySelector('.bubble');
      const progress = botMsgEl.querySelector('details.progress');
      if(progress) { progress.removeAttribute('open'); progress.remove(); }

      bubble.textContent = '';
      const answerEl = document.createElement('div');
      answerEl.className = 'answer';
      bubble.appendChild(answerEl);

      if((error || '').trim()) answerEl.textContent = `抱歉，本次攻略获取失败：\n${error}`;
      else renderAnswerWithImages(answerEl, answer || '', imageUrls || []);
      if(progress) bubble.appendChild(progress);
    }

    async function loadHistory(){
      try{
        const res = await fetch(`${API_BASE}/history/${sessionId}`);
        if(!res.ok) return;
        const data = await res.json();
        const items = data.items || [];
        if(items.length === 0) return;

        const nodes = Array.from(chatEl.querySelectorAll('.msg'));
        for(let i=1;i<nodes.length;i++) nodes[i].remove();

        items.forEach(item => {
          if(item.role === 'user') addUserMsg(item.text || '', item.ts);
          else addBotMsgWithTime(item.text || '', item.ts, item.image_urls || []);
        });
        scrollToBottom();
      }catch(e){}
    }

    async function submitQuery(text){
      const res = await fetch(`${API_BASE}/query`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ query: text, session_id: sessionId, is_stream: streamToggle.checked })
      });
      if(!res.ok) throw new Error(await res.text() || '请求失败');
      return await res.json();
    }

    async function onSend(){
      const text = (inputEl.value || '').trim();
      if(!text) return;
      inputEl.value = '';
      inputEl.style.height = 'auto'; // reset textarea height
      addUserMsg(text);
      const botMsgEl = addBotMsgSkeleton();
      sendBtn.disabled = true;

      try{
        const isStream = streamToggle.checked;
        const data = await submitQuery(text);
        renderProgress(botMsgEl, [], [], 'pending');

        if (!isStream) {
          renderProgress(botMsgEl, data.done_list || [], [], 'completed');
          finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || []);
          sendBtn.disabled = false;
          return;
        }

        const { task_id } = data;
        const bubble = botMsgEl.querySelector('.bubble');
        let answerEl = bubble.querySelector('.answer');
        if(!answerEl) { answerEl = document.createElement('div'); answerEl.className = 'answer'; bubble.insertBefore(answerEl, bubble.firstChild); }

        const es = new EventSource(`${API_BASE}/stream/${task_id}`);
        let rawAnswerText = '';

        es.addEventListener('progress', e => {
          try {
            const d = JSON.parse(e.data || '{}');
            renderProgress(botMsgEl, d.done_list, d.running_list, d.status);
            if(d.status === 'completed') {
              const typing = botMsgEl.querySelector('.typing');
              if(typing) typing.remove();
            }
          } catch(err){}
        });

        es.addEventListener('delta', e => {
          try {
            const delta = JSON.parse(e.data || '{}').delta || '';
            if(delta) {
              rawAnswerText += delta;
              renderAnswerWithImages(answerEl, rawAnswerText, []);
              scrollToBottom();
            }
          } catch(err){}
        });

        const handleFinal = (e) => {
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          const progress = botMsgEl.querySelector('details.progress');
          if(progress) progress.removeAttribute('open');

          try {
            const d = JSON.parse(e.data || '{}');
            const finalText = (d && d.answer && d.answer.trim().length > 0) ? d.answer : (rawAnswerText || answerEl.textContent || '');
            renderAnswerWithImages(answerEl, finalText, d.image_urls || []);
          } catch(err){}
          es.close(); sendBtn.disabled = false;
        };

        es.addEventListener('final', handleFinal);
        es.addEventListener('final_answer', handleFinal);
        es.addEventListener('error', e => {
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          try {
            const msg = e.data ? JSON.parse(e.data).error : '连接中断';
            rawAnswerText += `\n\n（错误：${msg}）`;
            renderAnswerWithImages(answerEl, rawAnswerText, []);
          } catch(err){}
          es.close(); sendBtn.disabled = false;
        });
      } catch(e) {
        const bubble = botMsgEl.querySelector('.bubble');
        const typing = botMsgEl.querySelector('.typing');
        if(typing) typing.remove();
        bubble.innerHTML = `请求失败：${escapeHtml(e.message || e)}`;
        sendBtn.disabled = false;
      }
    }

    // Auto-resize textarea
    inputEl.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
    });

    sendBtn.addEventListener('click', onSend);
    inputEl.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); onSend(); }
    });

    btnClear.addEventListener('click', async () => {
      if(!confirm('确定要清空当前的旅行记录吗？这将无法恢复。')) return;
      try { await fetch(`${API_BASE}/history/${sessionId}`, { method: 'DELETE' }); } catch(e) {}
      const nodes = Array.from(chatEl.querySelectorAll('.msg'));
      for(let i=1; i<nodes.length; i++) nodes[i].remove();
      scrollToBottom();
    });

    loadHistory();
    setTimeout(() => inputEl.focus(), 200);
  </script>
</body>
</html>
